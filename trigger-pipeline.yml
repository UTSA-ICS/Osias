default:
  # Official language image. Look for the different tagged releases at:
  # https://hub.docker.com/r/library/python/tags/
  image: python:3.13.7
  #interruptible: true
  tags:
    - docker-runner

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - prepare
  - cleanup
  - deploy

handle-yaml:
  stage: prepare
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: generate_yaml_config
  script:
    - echo "This job only exists to handle the YAML"
    - echo "$MULTINODE"
    - env
  artifacts:
    paths:
      - deploy*.yml

delete_tags_and_ips:
  stage: cleanup
  image: utsaics/maas:2.8
  before_script:
    - pip3 install PyYAML timeout_decorator proxmoxer
    - |
      if [ "$CLOUD_PROVIDER" == "proxmox" ]; then
        export PYTHONPATH="$PYTHONPATH:$CI_PROJECT_DIR/cloud_provider"
        pip3 install -qr cloud_provider/requirements.txt
      fi
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  script:
    - echo "This job only exists to cleanup IPs and tagging with a failed prepare"
    - python3 -u deploy.py delete_tags_and_ips --CLOUD_URL "$CLOUD_URL" --CLOUD_PASS "$CLOUD_PASS" --CLOUD_PROVIDER "$CLOUD_PROVIDER"
  rules:
    - if: '($MULTINODE == "" || $MULTINODE == null)  && $VM_PROFILE_CURRENT_RELEASE != null'
      when: on_failure

deploy:<RELEASE_NAME>:
  stage: deploy
  trigger:
    include:
      - artifact: deploy-<RELEASE_NAME>.yml
        job: handle-yaml
    strategy: depend
    forward:
      pipeline_variables: true # This forwards manual pipeline variables
      yaml_variables: true     # This forwards YAML-defined bridge variables (default behavior)
  variables:
    CEPH: <CEPH_CURRENT_BOOL>
    DOCKER_REGISTRY_PASSWORD: $DOCKER_REGISTRY_PASSWORD
    MULTINODE: $MULTINODE
    PARENT_PIPELINE_ID: $PARENT_PIPELINE_ID
    PARENT_CI_PIPELINE_SOURCE: $PARENT_CI_PIPELINE_SOURCE
    REPROVISION_SERVERS: $REPROVISION_SERVERS
    VM_PROFILE: <RELEASE_VM_PROFILE>
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
    CLOUD_URL: $CLOUD_URL
    CLOUD_PASS: $CLOUD_PASS
    CLOUD_PROVIDER: $CLOUD_PROVIDER

deploy:<PREVIOUS_RELEASE_NAME>:
  stage: deploy
  trigger:
    include:
      - artifact: deploy-<PREVIOUS_RELEASE_NAME>.yml
        job: handle-yaml
    strategy: depend
    forward:
      pipeline_variables: true # This forwards manual pipeline variables
      yaml_variables: true     # This forwards YAML-defined bridge variables (default behavior)
  variables:
    CEPH: <CEPH_PREVIOUS_BOOL>
    DOCKER_REGISTRY_PASSWORD: $DOCKER_REGISTRY_PASSWORD
    MULTINODE: $MULTINODE
    PARENT_PIPELINE_ID: $PARENT_PIPELINE_ID
    PARENT_CI_PIPELINE_SOURCE: $PARENT_CI_PIPELINE_SOURCE
    REPROVISION_SERVERS: $REPROVISION_SERVERS
    VM_PROFILE: $VM_PROFILE_PREVIOUS_RELEASE
    SSH_PRIVATE_KEY: $SSH_PRIVATE_KEY
    CLOUD_URL: $CLOUD_URL
    CLOUD_PASS: $CLOUD_PASS
    CLOUD_PROVIDER: $CLOUD_PROVIDER
  rules:
    - if: '($DEPLOY_MULTIPLE_RELEASES == "true")'
